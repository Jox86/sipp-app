<!DOCTYPE html>
<html>
<head><meta charset='utf-8'></head>
<body style='font-family: Arial, sans-serif; background: #F5F0E9; padding: 20px;'>
    <div style='max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; overflow: hidden;'>
        <div style='background: #4E0101; color: white; padding: 20px; text-align: center;'>
            <h2 style='margin: 0;'>Nueva Solicitud de Soporte - SiPP</h2>
        </div>
        <div style='padding: 20px;'>
            <p><strong>Usuario:</strong> {{ user_name }}</p>
            <p><strong>Email:</strong> {{ user_email }}</p>
            <p><strong>Rol:</strong> {{ user_role }}</p>
            <p><strong>Asunto:</strong> {{ subject }}</p>
            <hr>
            <p><strong>Mensaje:</strong></p>
            <p style='background: #f9f9f9; padding: 10px; border-radius: 4px;'>{{ message }}</p>
            <hr>
            <p style='font-size: 12px; color: #667080;'>Enviado desde el Centro de Ayuda SiPP - {{ date }}</p>
        </div>
        <div style='background: #d2b48c; color: #4E0101; padding: 10px; text-align: center; font-size: 12px;'>
            &copy; {{ year }} Sistema SiPP - Universidad de La Habana
        </div>
    </div>
</body>
</html>
